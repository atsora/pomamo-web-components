<div class="static-tests">
  <label>Height = default - Machine 3</label>
  <div class='divsize'>
    <x-performancegauge id="height_default_machine3" machine-id=1 path=http://localhost:8082/ range=[2026-05-21,2026-05-22)></x-performancegauge>
  </div>

  <label>Height = big + target defined - Machine 1</label>
  <div class='divsize_big'>
    <x-performancegauge id="height_big_target_machine1" machine-id=2 path=http://localhost:8082/ range=[2026-05-21,2026-05-22)></x-performancegauge>
  </div>

  <label>Height = small - Machine 2</label>
  <div class='divsize_small'>
    <x-performancegauge id="height_small_machine2" machine-id=4 path=http://localhost:8082/ range=[2026-05-21,2026-05-22)></x-performancegauge>
  </div>

  <label>Error: No monitored machine with id 300 (not working in 2018)</label>
  <div class='divsize'>
    <x-performancegauge id="error_machineid" machine-id=3 path=http://localhost:8082/ range=[2026-05-21,2026-05-22)
      update=10></x-performancegauge>
  </div>

  <label>Error: Gateway Timeout (not working in 2018)</label>
  <div class='divsize'>
    <x-performancegauge id="error_gateway_timeout" machine-id=1 path=http://localhost:8082/ range=[2026-05-21,2026-05-22)
      update=10></x-performancegauge>
  </div>
</div>
