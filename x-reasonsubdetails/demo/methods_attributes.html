<div class="attributes">
  <div class="demo-sub-title attribute-title">Attributes</div>
  <div class="demo-sub-content attribute-content">
    <div class="attribute-name mandatory integer"><code>machine-id</code></div>
    <div class="attribute-description">Id of the machine.</div>

    <div class="attribute-name mandatory string"><code>when</code></div>
    <div class="attribute-description">Date/time (ISO) at which the reasons are requested.</div>

    <div class="attribute-name integer"><code>clientX</code></div>
    <div class="attribute-description">Horizontal position of the popup, in pixels.</div>

    <div class="attribute-name integer"><code>clientY</code></div>
    <div class="attribute-description">Vertical position of the popup, in pixels.</div>

    <div class="attribute-name config optional string"><code>path</code></div>
    <div class="attribute-description">REST base path. Read from configuration when not provided.</div>
  </div>
</div>
