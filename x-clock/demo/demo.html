<div class="static-tests">
  <p>Wall clock with locale-aware formatting. The only meaningful axis is
     <code>display-seconds</code>; default behavior follows browser locale.</p>

  <h3>With seconds <small>(display-seconds=true)</small></h3>
  <div class="div-with-border">
    <x-clock display-seconds="true"></x-clock>
  </div>

  <h3>Without seconds <small>(display-seconds=false)</small></h3>
  <div class="div-with-border">
    <x-clock display-seconds="false"></x-clock>
  </div>

  <h3>No attribute — defaults (no seconds, locale format)</h3>
  <div class="div-with-border">
    <x-clock></x-clock>
  </div>
</div>
