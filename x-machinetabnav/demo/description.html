A mobile-only prev/next chevron pair for cycling between the machines exposed by
<code>x-machineselection</code>. Hidden on desktop (CSS-driven) — resize the
viewport to phone width to surface the buttons. Clicking a chevron dispatches
<code>machineIdChangeSignal</code> on the configured <code>machine-context</code>.
