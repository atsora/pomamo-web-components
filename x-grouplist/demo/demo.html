<div class='hidden-content'>
  <div class='machines_cell' id='boxtoclone'>
    <div class='tile-title'>
      <x-reasonbutton></x-reasonbutton>
      <div class='machinedisplay-position'>
        <x-machinedisplay></x-machinedisplay>
      </div>
    </div>
  </div>
</div>

<div class="static-tests">
  <p>Renders one row per machine, cloning <code>boxtoclone</code> for each of them.</p>

  <h3>Fixed machine list <small>(machine='1,2,3,4')</small></h3>
  <div class='group-div'>
    <x-grouplist templateid='boxtoclone' machine='1,2,3,4' no-rotation></x-grouplist>
  </div>

  <h3>Static group: milling cell <small>(group='101')</small></h3>
  <div class='group-div'>
    <x-grouplist templateid='boxtoclone' group='101' no-rotation></x-grouplist>
  </div>

  <h3>Empty group <small>(group='997')</small></h3>
  <div class='group-div'>
    <x-grouplist templateid='boxtoclone' group='997' no-rotation></x-grouplist>
  </div>
</div>

<div class="dynamic-tests">
  <h3>Dynamic group: 2 random machines, refreshed every 5 s <small>(group='Random', refreshrate='5')</small></h3>
  <div class='group-div'>
    <x-grouplist id='dynamic-list' templateid='boxtoclone' group='Random' refreshrate='5' no-rotation></x-grouplist>
  </div>
  <p><button id="get-machines">getMachinesList()</button> <span id="machines-list"></span></p>
</div>
