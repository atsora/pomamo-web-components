<div class="static-tests">
  <label>Default 24h window, marker at noon</label>
  <div style="width: 600px; background: #1a1a1a; padding: 4px;">
    <x-bartimeselection id="bts-default" range='[2026-05-21T00:00:00.000Z,2026-05-22T00:00:00.000Z)' when='2026-05-21T12:00:00.000Z'></x-bartimeselection>
  </div>

  <label>8h work shift, marker 1/3 of the way</label>
  <div style="width: 600px; background: #1a1a1a; padding: 4px;">
    <x-bartimeselection id="bts-shift" range='[2026-05-21T08:00:00.000Z,2026-05-21T16:00:00.000Z)' when='2026-05-21T10:40:00.000Z'></x-bartimeselection>
  </div>

  <label>Without `when` (no marker — to test "absent" rendering)</label>
  <div style="width: 600px; background: #1a1a1a; padding: 4px;">
    <x-bartimeselection id="bts-empty" range='[2026-05-21T08:00:00.000Z,2026-05-21T16:00:00.000Z)'></x-bartimeselection>
  </div>
</div>
