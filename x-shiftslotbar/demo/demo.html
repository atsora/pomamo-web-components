<div class="static-tests">
  <p>Renders shift boundaries over a time range. The only meaningful axis is
     the bar height.</p>

  <h3>Default height — shifts over a 24 h range</h3>
  <div class="pulse-bar-div">
    <x-shiftslotbar range='[2026-05-21T00:00:00.000Z;2026-05-22T00:00:00.000Z)'
      path='http://localhost:8082/'></x-shiftslotbar>
  </div>

  <h3>Tall (height=80) — shift labels readable</h3>
  <div class="pulse-bar-div">
    <x-shiftslotbar range='[2026-05-21T00:00:00.000Z;2026-05-22T00:00:00.000Z)'
      path='http://localhost:8082/' height="80"></x-shiftslotbar>
  </div>

  <h3>Compact (height=10) — boundaries only, no labels</h3>
  <div class="pulse-bar-div">
    <x-shiftslotbar range='[2026-05-21T00:00:00.000Z;2026-05-22T00:00:00.000Z)'
      path='http://localhost:8082/' height="10"></x-shiftslotbar>
  </div>
</div>
