<script>
  function getValuesButtonFunction() {
    let DPs = $('.static-tests').find('x-datepicker');
    for (let i = 0; i < DPs.length; i++) {
      let value = DPs[i].getISOValue();
      $(DPs[i]).parent().find('.DP-getValue').html(value);
    };
  }
</script>

<div class="static-tests">
  <button class="getValuesButton" onclick="getValuesButtonFunction()">GET VALUES</button>

  <div class="testDP">
    <label>Current date (default)</label>
    <div class='dp_position'>
      <x-datepicker id="current"></x-datepicker>
      <div class='valuediv'>
        <label class="labelGetValue">GET VALUE :</label> <span class="DP-getValue"></span>
      </div>
    </div>
  </div>

  <div class="testDP">
    <label>Fix date 2026-05-21 + min 2026-05-21 + max 2026-05-21</label>
    <div class='dp_position'>
      <x-datepicker id="fixed_date_all_options"
        mindate="2026-05-21" maxdate="2026-05-21" defaultdate="2026-05-21">
      </x-datepicker>
      <div class='valuediv'>
        <label class="labelGetValue">GET VALUE :</label> <span class="DP-getValue"></span>
      </div>
    </div>
  </div>

  <div class="testDP">
    <label>Fix date 2026-05-21 + min 2026-05-21 + max 2026-05-21 + display out of range MIN</label>
    <div class='dp_position'>
      <x-datepicker id="" mindate="2026-05-21" maxdate="2026-05-21"
        defaultdate="2026-05-21"></x-datepicker>
      <div class='valuediv'>
        <label class="labelGetValue">GET VALUE :</label> <span class="DP-getValue"></span>
      </div>
    </div>
  </div>

  <div class="testDP">
    <label>Fix date 2026-05-21 + min 2026-05-21 + max 2026-05-21 + display out of range MAX</label>
    <div class='dp_position'>
      <x-datepicker id="" mindate="2026-05-21" maxdate="2026-05-21"
        defaultdate="2026-05-21"></x-datepicker>
      <div class='valuediv'>
        <label class="labelGetValue">GET VALUE :</label> <span class="DP-getValue"></span>
      </div>
    </div>
  </div>

</div>
