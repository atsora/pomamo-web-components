Icon button to drill down from a tile into a group. It calls <code>Machine/GroupZoomIn</code> and is only
visible when the group is static and has children. A click reloads the current page with
<code>group=&lt;group&gt;</code>, clears <code>machine</code> and adds the previous selection as the next
<code>ancestor&lt;N&gt;</code> parameter.
