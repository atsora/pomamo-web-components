<div class="static-tests">
  <p>Login form for the Pulse web app. The mock accepts
     <code>manager</code>/<code>anypass</code> or <code>operator</code>/<code>anypass</code>
     — anything else returns HTTP 401.</p>

  <h3>Empty — login form (try <code>manager</code> / <code>anypass</code>)</h3>
  <div class='border-class'>
    <x-loginconnection path="http://localhost:8082/"></x-loginconnection>
  </div>

  <h3>Already logged in as <code>manager</code> — logout button visible</h3>
  <div class='border-class'>
    <x-loginconnection PulseLogin='manager' path="http://localhost:8082/"
      PulseWebAppLogin='manager'></x-loginconnection>
  </div>

  <h3>Already logged in as <code>operator</code> — logout button visible</h3>
  <div class='border-class'>
    <x-loginconnection PulseLogin='operator' path="http://localhost:8082/"
      PulseWebAppLogin='operator'></x-loginconnection>
  </div>
</div>
