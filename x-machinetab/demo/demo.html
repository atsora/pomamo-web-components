<div class="static-tests">

  <div class="demo-block">
    <div class="demo-sub-title">Default strip (machines 1..4 from the shared scenario)</div>
    <!-- Headless period source: drives the range needed by per-tab icons -->
    <x-periodmanager displaydaysrange="0" displayhoursrange="8" exclude-now="false" period-context="machinetab-demo"></x-periodmanager>
    <x-machinetab id="machinetab-main" machine-context="demo" period-context="machinetab-demo"></x-machinetab>
    <div class="demo-meta">
      Selected machine: <span id="selected-machine">—</span>
    </div>
  </div>

  <div class="demo-block">
    <div class="demo-sub-title">Re-dispatch <code>machineListChanged</code></div>
    <button id="dispatch-all">Restore 4 machines</button>
    <button id="dispatch-empty">Send empty list</button>
    <button id="dispatch-error">Simulate network error</button>
  </div>

</div>
