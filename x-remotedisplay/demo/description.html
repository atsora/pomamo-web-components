Passive display driven by the event bus. It listens to <code>displayChangeEvent</code> on its
<code>display-context</code> and renders the <code>Display</code> field of the event as HTML.
The event can also carry <code>ClassToAdd</code> / <code>ClassToRemove</code> to toggle a CSS class
on the content.
