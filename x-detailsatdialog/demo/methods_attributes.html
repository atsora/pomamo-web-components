<div class="attributes">
  <div class="demo-sub-title attribute-title">Attributes</div>
  <div class="demo-sub-content attribute-content">
    <div class="attribute-name integer"><code>machine-id</code></div>
    <div class="attribute-description">Id of the machine.</div>

    <div class="attribute-name string"><code>when</code></div>
    <div class="attribute-description">Clicked date/time (ISO), forwarded to the <code>x-detailed*</code> components.</div>

    <div class="attribute-name string"><code>range</code></div>
    <div class="attribute-description">Period around the click, displayed by the bar.</div>

    <div class="attribute-name config string"><code>showcoloredbar.showdetails</code></div>
    <div class="attribute-description">Configuration only: list of the <code>x-detailed*</code> components to
      display.</div>
  </div>
</div>
