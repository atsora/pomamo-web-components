<div class="static-tests">
  <p>Static legend panel for machine modes. Fetches <code>MachineModeColorLegend</code>
     once. The visual variation here is about container width — the legend
     wraps differently depending on space.</p>

  <h3>Default — full-width container</h3>
  <div>
    <x-machinemodelegends path="http://localhost:8082/"></x-machinemodelegends>
  </div>

  <h3>Narrow container (300 px) — legend wraps</h3>
  <div style="width: 300px; border: 1px dashed #888; padding: 4px;">
    <x-machinemodelegends path="http://localhost:8082/"></x-machinemodelegends>
  </div>

  <h3>Wide container (1000 px) — legend spreads</h3>
  <div style="width: 1000px; border: 1px dashed #888; padding: 4px;">
    <x-machinemodelegends path="http://localhost:8082/"></x-machinemodelegends>
  </div>
</div>
